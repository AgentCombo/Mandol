name: Build Sphinx Docs

on:
  push:
    branches: [main, paper-repro]
    paths:
      - "docs/**"
      - "src/mandol/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main, paper-repro]
    paths:
      - "docs/**"
      - "src/mandol/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install documentation environment
        run: uv sync --frozen --extra docs

      - name: Build maintained documentation
        run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Upload documentation
        uses: actions/upload-artifact@v7
        with:
          name: mandol-sphinx-docs
          path: docs/_build/html/
          if-no-files-found: error
